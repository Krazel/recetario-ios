name: Recetario
options:
  bundleIdPrefix: com.krazel
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.2.1'
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_LANGUAGE: es
    CODE_SIGN_STYLE: Automatic
targets:
  Recetario:
    type: application
    platform: iOS
    sources: [Recetario]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krazel.recetario
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Recetario/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [RecetarioTests]
  RecetarioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RecetarioTests]
    dependencies:
      - target: Recetario
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
