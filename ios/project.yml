name: Recetario
options:
  bundleIdPrefix: com.krazel
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_LANGUAGE: es
    CODE_SIGN_STYLE: Automatic
targets:
  Recetario:
    type: application
    platform: iOS
    sources:
      - path: Recetario
        # Preserved for a later cloud release, excluded from the local iPhone app.
        excludes:
          - AccountClient.swift
          - RecetarioController.swift
          - SubscriptionController.swift
      - path: Resources/OfflineApp
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krazel.recetario
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Recetario/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Recetario/Recetario.entitlements
        APP_ATTEST_ENVIRONMENT: production
        RECETARIO_AI_ENDPOINT: 'https://recetario-ia-krazel.krazel.chatgpt.site/native'
      configs:
        Debug:
          APP_ATTEST_ENVIRONMENT: development
    scheme:
      testTargets: [RecetarioTests]
  RecetarioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RecetarioTests
        excludes: [CorrectionFlow.js]
      - path: RecetarioTests/CorrectionFlow.js
        buildPhase: resources
    dependencies:
      - target: Recetario
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  StoreScreenshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StoreScreenshotTests
        excludes: [StoreFixture.js]
      - path: StoreScreenshotTests/StoreFixture.js
        buildPhase: resources
    dependencies:
      - target: Recetario
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RecetarioStoreScreenshots:
    build:
      targets:
        Recetario: all
        StoreScreenshotTests: [test]
    test:
      targets: [StoreScreenshotTests]
