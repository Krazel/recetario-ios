name: iOS actual store screenshots (manual)
on:
  workflow_dispatch:
    inputs:
      device:
        description: Native screenshot device
        type: choice
        options: [all, iphone, iphone-medium, ipad]
        default: all
permissions:
  contents: read
concurrency:
  group: recetario-store-screenshots-${{ inputs.device || 'all' }}
  cancel-in-progress: false
jobs:
  capture:
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(inputs.device == 'all' && '["iphone","iphone-medium","ipad"]' || format('["{0}"]', inputs.device)) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Capture actual native screens
        env:
          RECETARIO_STORE_DEVICE: ${{ matrix.device }}
        run: bash ios/build-store-screenshots.sh
      # Capture bytes are in logs; no paid artifacts/cache storage, signing or upload.
